name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest firmware parts for same-origin serving
        run: |
          RELEASE=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/latest" || echo '{}')
          TAG=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo '')
          echo "Latest release tag: $TAG"

          for ASSET in bootloader.bin partitions.bin firmware.bin; do
            URL=$(echo "$RELEASE" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          a = next((x for x in r.get('assets', []) if x['name'] == '$ASSET'), None)
          print(a['browser_download_url'] if a else '')
            " 2>/dev/null || echo '')

            if [ -n "$URL" ]; then
              echo "Downloading $ASSET from $URL"
              curl -sL "$URL" -o "$ASSET"
              echo "  -> $(wc -c < $ASSET) bytes"
            else
              echo "No $ASSET in latest release — using committed version"
            fi
          done
        continue-on-error: true

      - name: Update manifest.json version from latest release
        run: |
          TAG=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo '')
          if [ -n "$TAG" ]; then
            python3 -c "
          import json
          with open('manifest.json') as f: m = json.load(f)
          m['version'] = '$TAG'
          with open('manifest.json', 'w') as f: json.dump(m, f, indent=2)
          print('manifest.json version set to $TAG')
            "
          fi
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
