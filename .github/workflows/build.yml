name: Build Firmware

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build XIAO ESP32-S3 firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e xiao_esp32s3

      - name: Collect firmware parts
        run: |
          mkdir -p dist
          BOOTLOADER=".pio/build/xiao_esp32s3/bootloader.bin"
          PARTITIONS=".pio/build/xiao_esp32s3/partitions.bin"

          cp "$BOOTLOADER" dist/bootloader.bin
          cp "$PARTITIONS" dist/partitions.bin

          # Use the merged binary (bootloader+partitions+app at offset 0x0)
          # produced by scripts/merge_firmware.py post-build hook.
          # Falls back to app-only if merge failed (rare).
          if [ -f "firmware.bin" ] && [ "$(wc -c < firmware.bin)" -gt 100000 ]; then
            cp firmware.bin dist/firmware.bin
            echo "Using merged firmware.bin ($(wc -c < dist/firmware.bin) bytes)"
          else
            echo "Merged binary not found or too small — building manually"
            BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" -path "*/partitions/*" 2>/dev/null | head -1)
            MERGE_ARGS="--chip esp32s3 merge_bin -o dist/firmware.bin 0x0 $BOOTLOADER 0x8000 $PARTITIONS"
            [ -n "$BOOT_APP0" ] && MERGE_ARGS="$MERGE_ARGS 0xe000 $BOOT_APP0"
            MERGE_ARGS="$MERGE_ARGS 0x10000 .pio/build/xiao_esp32s3/firmware.bin"
            python -m esptool $MERGE_ARGS || cp .pio/build/xiao_esp32s3/firmware.bin dist/firmware.bin
            echo "Fallback firmware.bin: $(wc -c < dist/firmware.bin) bytes"
          fi

          echo "bootloader.bin:  $(wc -c < dist/bootloader.bin) bytes"
          echo "partitions.bin:  $(wc -c < dist/partitions.bin) bytes"
          echo "firmware.bin:    $(wc -c < dist/firmware.bin) bytes"

      - name: Update manifest.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c "
          import json
          tag = '${{ github.ref_name }}'
          with open('manifest.json') as f: m = json.load(f)
          m['version'] = tag
          with open('manifest.json', 'w') as f: json.dump(m, f, indent=2)
          print('manifest.json version:', tag)
          "
          cp manifest.json dist/manifest.json

      - name: Copy manifest to dist (non-tag builds)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cp manifest.json dist/manifest.json

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiao-esp32s3
          path: |
            dist/bootloader.bin
            dist/partitions.bin
            dist/firmware.bin
            dist/manifest.json
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-xiao-esp32s3
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bootloader.bin
            dist/partitions.bin
            dist/firmware.bin
            dist/manifest.json
          generate_release_notes: true
          body: |
            ## Claude Token Meter Firmware ${{ github.ref_name }}

            ### Hardware
            - **MCU**: Seeed XIAO ESP32-S3
            - **Display**: SSD1306 0.96" OLED (I2C)
            - **Audio**: MAX98357 I2S 3W Amplifier

            ### Flash using the Web Flasher
            Open https://ajvizganapathy-pixel.github.io/claude-token-meter/ in Chrome or Edge.
            Click **Download Latest Firmware** → **Connect** → **Flash All Parts**.

            ### 3-Part Flash Layout
            | Part | Offset | File |
            |------|--------|------|
            | Bootloader | 0x0000 | bootloader.bin |
            | Partition table | 0x8000 | partitions.bin |
            | Application | 0x10000 | firmware.bin |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
