name: Build Firmware

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build XIAO ESP32-S3 firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e xiao_esp32s3

      - name: Produce merged firmware (bootloader + partitions + app at 0x0)
        run: |
          pip install esptool -q
          BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" -path "*/partitions/*" 2>/dev/null | head -1)
          BOOTLOADER=".pio/build/xiao_esp32s3/bootloader.bin"
          PARTITIONS=".pio/build/xiao_esp32s3/partitions.bin"
          APP=".pio/build/xiao_esp32s3/firmware.bin"
          MERGED="flasher/firmware.bin"
          echo "Bootloader:  $(wc -c < $BOOTLOADER) bytes"
          echo "Partitions:  $(wc -c < $PARTITIONS) bytes"
          echo "Application: $(wc -c < $APP) bytes"
          if [ -n "$BOOT_APP0" ]; then
            echo "boot_app0:   $BOOT_APP0"
            python -m esptool --chip esp32s3 merge_bin \
              -o "$MERGED" \
              0x0     "$BOOTLOADER" \
              0x8000  "$PARTITIONS" \
              0xe000  "$BOOT_APP0" \
              0x10000 "$APP"
          else
            python -m esptool --chip esp32s3 merge_bin \
              -o "$MERGED" \
              0x0     "$BOOTLOADER" \
              0x8000  "$PARTITIONS" \
              0x10000 "$APP"
          fi
          echo "Merged firmware: $(wc -c < $MERGED) bytes"

      - name: Update manifest.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c "
          import json
          tag = '${{ github.ref_name }}'
          with open('manifest.json') as f: m = json.load(f)
          m['version'] = tag
          with open('manifest.json', 'w') as f: json.dump(m, f, indent=2)
          print('manifest.json version:', tag)
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiao-esp32s3
          path: |
            flasher/firmware.bin
            flasher/index.html
            manifest.json
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-xiao-esp32s3
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/firmware.bin
            dist/manifest.json
          generate_release_notes: true
          body: |
            ## Claude Token Meter Firmware ${{ github.ref_name }}

            ### Hardware
            - **MCU**: Seeed XIAO ESP32-S3
            - **Display**: SSD1306 0.96" OLED (I2C)
            - **Audio**: MAX98357 I2S 3W Amplifier

            ### Flash using the Web Flasher
            Open `flasher/index.html` in Chrome/Edge after downloading this release.

            ### What's New
            See commit history for changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
