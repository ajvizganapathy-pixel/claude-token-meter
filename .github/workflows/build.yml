name: Build Firmware

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build XIAO ESP32-S3 firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e xiao_esp32s3

      - name: Copy firmware to flasher/
        run: |
          cp .pio/build/xiao_esp32s3/firmware.bin flasher/firmware.bin
          echo "Firmware size: $(wc -c < flasher/firmware.bin) bytes"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-xiao-esp32s3
          path: |
            flasher/firmware.bin
            flasher/index.html
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-xiao-esp32s3
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/firmware.bin
          generate_release_notes: true
          body: |
            ## Claude Token Meter Firmware ${{ github.ref_name }}

            ### Hardware
            - **MCU**: Seeed XIAO ESP32-S3
            - **Display**: SSD1306 0.96" OLED (I2C)
            - **Audio**: MAX98357 I2S 3W Amplifier

            ### Flash using the Web Flasher
            Open `flasher/index.html` in Chrome/Edge after downloading this release.

            ### What's New
            See commit history for changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
