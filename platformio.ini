
; ═══════════════════════════════════════════════════
;   Claude Token Meter — PlatformIO Configuration
;   Board: Seeed XIAO ESP32-S3
; ═══════════════════════════════════════════════════

[platformio]
src_dir = firmware/ClaudeTokenMeter

[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino

; ─── Serial ───────────────────────────────────────
monitor_speed  = 115200
monitor_filter = esp32_exception_decoder

; ─── Build ───────────────────────────────────────
upload_speed = 921600
build_flags  =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ─── Libraries ───────────────────────────────────
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.1.0

; ─── Partition scheme (4MB with SPIFFS) ──────────
board_build.partitions = default.csv

; ─── Extra scripts (auto-copy merged .bin to flasher/) ──
extra_scripts = post:scripts/copy_firmware.py
